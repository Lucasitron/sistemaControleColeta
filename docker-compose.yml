services:
  app:
    build: .
    container_name: cobrancacopa
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./.wwebjs_auth_nova:/app/.wwebjs_auth_nova
      - ./.wwebjs_cache:/app/.wwebjs_cache
      - ./resolv.conf:/etc/resolv.conf:ro
    environment:
      - PORT=1213
      - NODE_OPTIONS=--dns-result-order=ipv4first
